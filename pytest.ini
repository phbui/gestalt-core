[pytest]
markers =
    local: capability-gated tests that self-skip in CI (missing corpus, missing binaries,
        hostname-gated, opt-in env flags) but exercise real capability when run locally.
        Select with `pytest -m local`. The three tiers are: the default run (everything that needs no local capability), `-m local` (needs a corpus, a binary, a host or an opt-in flag), and `-m release_gate` (blocks an export).
    release_gate: checks that must be green before an export ships, such as benchmark numbers that match the shipped code.
        Deselected from the normal run. Select with `pytest -m release_gate`.
addopts = -m "not release_gate"
