name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install CPU torch, then the tool requirements
        # torch comes from the CPU index first, so pip does not pull a CUDA build of about 2 GB.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/requirements.txt pytest pyyaml markdown
      - name: Run tests
        # The tests use stub encoders. Offline mode makes a model download at test time an error.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest tests/ -q

  skill-evals:
    name: Skill eval configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyyaml
      - name: Validate every skill eval config
        run: python3 evals/run_evals.py validate

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: bash -n every shell script
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            case "$(head -c 60 "$f")" in
              *'/bin/sh'*|*'env sh'*) sh -n "$f" || { echo "::error file=$f::sh syntax error"; fail=1; } ;;
              *) bash -n "$f" || { echo "::error file=$f::bash syntax error"; fail=1; } ;;
            esac
          done < <(bash tools/ci/shell-files.sh)
          exit $fail

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan tracked files for credential patterns
        run: |
          set -uo pipefail
          hits=$(git ls-files | xargs -r grep -nIE \
            'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|sk-ant-api[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}' \
            2>/dev/null | grep -v '\.\.\.$' | grep -v -E '^(tools/capture-skill-run.py|\.github/workflows/ci.yaml|tests/test_skill_capture.py):' || true)
          if [ -n "$hits" ]; then
            echo "::error::credential pattern found in a tracked file"
            echo "$hits"
            exit 1
          fi
