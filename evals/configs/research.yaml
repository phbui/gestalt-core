    should_trigger: true
  - prompt: "Best practices for real-time sync in offline-first PWAs in 2026"
    should_trigger: true
  - prompt: "What did we learn last week about the spatial pipeline?"
    should_trigger: false
    routes_to: "consolidate"
output_assertions:
