# derived from .claude/skills/mutate/SKILL.md (Evals table + Step 6 Confirm template, command-file prohibition, dual-directory sync)
skill: mutate
trigger_cases:
  - prompt: "Create a new gestalt skill called `triage` that triages incoming bug reports"
    should_trigger: true
  - prompt: "Rename the /understand command to /investigate everywhere"
    should_trigger: true
  - prompt: "Save what we learned this session about platform deploy"
    should_trigger: false
    routes_to: "save"
output_assertions:
  - type: regex
    value: "\\.cursor/skills/[^\\s]+/SKILL\\.md"
    description: "Rules require syncing both tool directories; scaffold always writes the .cursor mirror"
  - type: not_contains
    value: ".claude/commands/"
    description: "Step 2 forbids creating .claude/commands/<name>.md — the SKILL.md IS the command"
  - type: regex
    value: "Symlinks:"
    description: "Step 6 Confirm template literal summary line"
